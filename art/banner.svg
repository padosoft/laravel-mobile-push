<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1774" height="887" viewBox="0 0 1774 887" role="img" aria-labelledby="t d">
  <title id="t">Laravel Mobile Push</title>
  <desc id="d">One line of Laravel code fans out into two delivery beams, labelled APNs and FCM, that reach an iPhone-style phone showing a Live Activity and a notification, and an Android-style phone showing notifications.</desc>
  <defs>
    <style>
      .display { font-family: 'Inter Display', 'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif; }
      .sans { font-family: 'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', 'Liberation Mono', monospace; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E22"/>
      <stop offset="1" stop-color="#05060F"/>
    </linearGradient>
    <radialGradient id="glowCoral" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF5D6C" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FF5D6C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#46E0CF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#46E0CF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6B78"/>
      <stop offset="1" stop-color="#FFA26B"/>
    </linearGradient>
    <linearGradient id="beamIos" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF5D6C"/>
      <stop offset="1" stop-color="#FFB27A"/>
    </linearGradient>
    <linearGradient id="beamAndroid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF5D6C"/>
      <stop offset="1" stop-color="#46E0CF"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1F42"/>
      <stop offset="1" stop-color="#0C0F24"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A5080"/>
      <stop offset="0.5" stop-color="#262A4D"/>
      <stop offset="1" stop-color="#3A3F6A"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1774" height="887" fill="url(#bg)"/>
  <rect width="1774" height="887" fill="url(#dots)"/>
  <circle cx="830" cy="690" r="420" fill="url(#glowCoral)"/>
  <circle cx="1390" cy="430" r="520" fill="url(#glowCyan)"/>

  <!-- Signature -->
  <g transform="translate(96 66)">
    <rect width="34" height="34" rx="9" fill="none" stroke="#FF6B78" stroke-width="3"/>
    <circle cx="17" cy="17" r="5.5" fill="#FF6B78"/>
    <text x="50" y="26" class="sans" font-size="26" font-weight="600" fill="#C9CDE6" letter-spacing="0.5">padosoft</text>
  </g>

  <!-- Name and tagline -->
  <text x="90" y="226" class="display" font-size="118" font-weight="800" fill="#F5F6FF" letter-spacing="-2">Laravel</text>
  <text x="90" y="350" class="display" font-size="118" font-weight="800" fill="url(#titleGrad)" letter-spacing="-2">Mobile Push</text>
  <text x="94" y="420" class="sans" font-size="34" font-weight="500" fill="#E2E5F7">APNs, FCM &amp; Live Activities for Laravel</text>

  <!-- Capability chips -->
  <g class="mono" font-size="18" font-weight="500" fill="#C9CDE6">
    <g transform="translate(94 456)">
      <rect width="104" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="52" y="25" text-anchor="middle">HTTP/2</text>
    </g>
    <g transform="translate(212 456)">
      <rect width="214" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="107" y="25" text-anchor="middle">Explicit outcomes</text>
    </g>
    <g transform="translate(440 456)">
      <rect width="204" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="102" y="25" text-anchor="middle">Durable delivery</text>
    </g>
  </g>

  <!-- Code card: the origin -->
  <g filter="url(#shadow)">
    <rect x="90" y="560" width="712" height="232" rx="20" fill="#0F1330" stroke="#FFFFFF" stroke-opacity="0.12"/>
  </g>
  <circle cx="118" cy="588" r="6" fill="#FF6B78" fill-opacity="0.8"/>
  <circle cx="138" cy="588" r="6" fill="#FFB27A" fill-opacity="0.6"/>
  <circle cx="158" cy="588" r="6" fill="#46E0CF" fill-opacity="0.6"/>
  <g class="mono" font-size="19">
    <text x="120" y="640"><tspan fill="#8FD6FF">MobilePush</tspan><tspan fill="#A9AFCF">::</tspan><tspan fill="#F5F6FF">to</tspan><tspan fill="#A9AFCF">(</tspan><tspan fill="#FFB27A">$user</tspan><tspan fill="#A9AFCF">)-&gt;</tspan><tspan fill="#F5F6FF">send</tspan><tspan fill="#A9AFCF">(</tspan></text>
    <text x="120" y="672" xml:space="preserve"><tspan fill="#A9AFCF">    </tspan><tspan fill="#8FD6FF">PushMessage</tspan><tspan fill="#A9AFCF">::</tspan><tspan fill="#F5F6FF">make</tspan><tspan fill="#A9AFCF">(</tspan><tspan fill="#9BE7A4">'Order shipped'</tspan><tspan fill="#A9AFCF">, </tspan><tspan fill="#9BE7A4">'Arrives Friday'</tspan><tspan fill="#A9AFCF">)</tspan></text>
    <text x="120" y="704" fill="#A9AFCF">);</text>
  </g>
  <!-- outcome pills -->
  <line x1="110" y1="726" x2="782" y2="726" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <g class="mono" font-size="17" font-weight="600">
    <g transform="translate(120 744)">
      <rect width="186" height="32" rx="8" fill="#46E0CF" fill-opacity="0.12" stroke="#46E0CF" stroke-opacity="0.5"/>
      <path d="M14 16 l6 6 l11 -12" fill="none" stroke="#46E0CF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="40" y="22" fill="#BFF5EE">apns accepted</text>
    </g>
    <g transform="translate(320 744)">
      <rect width="176" height="32" rx="8" fill="#46E0CF" fill-opacity="0.12" stroke="#46E0CF" stroke-opacity="0.5"/>
      <path d="M14 16 l6 6 l11 -12" fill="none" stroke="#46E0CF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="40" y="22" fill="#BFF5EE">fcm accepted</text>
    </g>
  </g>

  <!-- Beams (drawn behind the phones) -->
  <g fill="none" stroke-linecap="round">
    <path id="pIos" d="M802 676 C 930 676, 950 360, 1080 360" stroke="url(#beamIos)" stroke-width="14" stroke-opacity="0.35" filter="url(#soft)"/>
    <path d="M802 676 C 930 676, 950 360, 1080 360" stroke="url(#beamIos)" stroke-width="4"/>
    <path d="M802 676 C 930 676, 950 360, 1080 360" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 22" stroke-opacity="0.9"/>
    <path d="M802 676 C 1000 676, 1080 820, 1260 820 S 1400 760, 1420 560" stroke="url(#beamAndroid)" stroke-width="14" stroke-opacity="0.35" filter="url(#soft)"/>
    <path d="M802 676 C 1000 676, 1080 820, 1260 820 S 1400 760, 1420 560" stroke="url(#beamAndroid)" stroke-width="4"/>
    <path d="M802 676 C 1000 676, 1080 820, 1260 820 S 1400 760, 1420 560" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 22" stroke-opacity="0.9"/>
  </g>
  <!-- origin node with signal arcs -->
  <g fill="none" stroke="#FF6B78" stroke-linecap="round">
    <path d="M826 640 A 50 50 0 0 1 826 712" stroke-width="3" stroke-opacity="0.7"/>
    <path d="M846 616 A 80 80 0 0 1 846 736" stroke-width="3" stroke-opacity="0.4"/>
    <path d="M866 594 A 110 110 0 0 1 866 758" stroke-width="3" stroke-opacity="0.2"/>
  </g>
  <circle cx="802" cy="676" r="18" fill="#FF5D6C" fill-opacity="0.35" filter="url(#soft)"/>
  <circle cx="802" cy="676" r="9" fill="#FFE3E6"/>
  <!-- provider labels -->
  <g class="mono" font-size="16" font-weight="700" letter-spacing="2">
    <rect x="904" y="470" width="76" height="30" rx="15" fill="#0B0E22" stroke="#FFB27A" stroke-opacity="0.7"/>
    <text x="942" y="491" text-anchor="middle" fill="#FFC9A3">APNs</text>
    <rect x="1110" y="802" width="66" height="30" rx="15" fill="#0B0E22" stroke="#46E0CF" stroke-opacity="0.7"/>
    <text x="1143" y="823" text-anchor="middle" fill="#BFF5EE">FCM</text>
  </g>

  <!-- iOS-style phone -->
  <g filter="url(#shadow)">
    <rect x="1064" y="104" width="300" height="640" rx="56" fill="url(#frame)"/>
  </g>
  <rect x="1074" y="114" width="280" height="620" rx="47" fill="url(#screen)"/>
  <!-- Dynamic Island, expanded with a Live Activity -->
  <rect x="1090" y="128" width="248" height="74" rx="37" fill="#000000"/>
  <g>
    <rect x="1108" y="142" width="30" height="30" rx="9" fill="#46E0CF" fill-opacity="0.18"/>
    <path d="M1115 153 l8 -4 l8 4 v9 l-8 4 l-8 -4 z M1115 153 l8 4 l8 -4 M1123 157 v9" fill="none" stroke="#46E0CF" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="1148" y="155" class="sans" font-size="13" font-weight="500" fill="#A9AFCF">Out for delivery</text>
    <text x="1148" y="172" class="sans" font-size="14" font-weight="700" fill="#F5F6FF">Order #2481</text>
    <text x="1322" y="170" text-anchor="end" class="display" font-size="24" font-weight="700" fill="#46E0CF">12 min</text>
    <rect x="1112" y="184" width="206" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.15"/>
    <rect x="1112" y="184" width="146" height="5" rx="2.5" fill="#46E0CF"/>
    <circle cx="1258" cy="186.5" r="5" fill="#E9FFFC"/>
  </g>
  <!-- lock screen -->
  <text x="1214" y="296" text-anchor="middle" class="display" font-size="76" font-weight="300" fill="#F5F6FF" fill-opacity="0.92">9:41</text>
  <text x="1214" y="226" text-anchor="middle" class="sans" font-size="15" font-weight="500" fill="#A9AFCF">Friday 21 November</text>
  <!-- notification card (beam target) -->
  <rect x="1078" y="318" width="272" height="86" rx="22" fill="#FF5D6C" fill-opacity="0.25" filter="url(#soft)"/>
  <rect x="1086" y="324" width="256" height="78" rx="20" fill="#272C55" stroke="#FFB27A" stroke-opacity="0.55"/>
  <rect x="1100" y="340" width="40" height="40" rx="11" fill="#FF5D6C"/>
  <path d="M1112 368 h16 c-2 -2 -3 -4 -3 -8 v-4 a5 5 0 0 0 -10 0 v4 c0 4 -1 6 -3 8 z M1117 371 a3 3 0 0 0 6 0" fill="#FFFFFF"/>
  <text x="1152" y="352" class="sans" font-size="15" font-weight="700" fill="#F5F6FF">Order shipped</text>
  <text x="1330" y="352" text-anchor="end" class="sans" font-size="12" fill="#A9AFCF">now</text>
  <text x="1152" y="374" class="sans" font-size="14" fill="#C9CDE6">Arrives Friday</text>
  <!-- live activity on the lock screen -->
  <rect x="1086" y="416" width="256" height="112" rx="20" fill="#1F2449" stroke="#46E0CF" stroke-opacity="0.35"/>
  <text x="1104" y="446" class="sans" font-size="13" font-weight="600" fill="#46E0CF" letter-spacing="1">LIVE ACTIVITY</text>
  <text x="1324" y="446" text-anchor="end" class="sans" font-size="13" fill="#A9AFCF">ETA 14:32</text>
  <text x="1104" y="476" class="sans" font-size="17" font-weight="700" fill="#F5F6FF">Courier is 3 stops away</text>
  <line x1="1108" y1="504" x2="1320" y2="504" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="5" stroke-linecap="round"/>
  <line x1="1108" y1="504" x2="1258" y2="504" stroke="#46E0CF" stroke-width="5" stroke-linecap="round"/>
  <circle cx="1108" cy="504" r="6" fill="#46E0CF"/>
  <circle cx="1188" cy="504" r="6" fill="#46E0CF"/>
  <circle cx="1258" cy="504" r="8" fill="#E9FFFC" stroke="#46E0CF" stroke-width="3"/>
  <circle cx="1320" cy="504" r="6" fill="#3A3F6A"/>
  <!-- faint older notification -->
  <rect x="1086" y="540" width="256" height="62" rx="18" fill="#FFFFFF" fill-opacity="0.05"/>
  <rect x="1100" y="554" width="34" height="34" rx="9" fill="#FFFFFF" fill-opacity="0.08"/>
  <rect x="1146" y="560" width="120" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.16"/>
  <rect x="1146" y="576" width="160" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.09"/>
  <rect x="1164" y="712" width="100" height="5" rx="2.5" fill="#F5F6FF" fill-opacity="0.7"/>

  <!-- Android-style phone -->
  <g filter="url(#shadow)">
    <rect x="1404" y="196" width="290" height="630" rx="38" fill="url(#frame)"/>
  </g>
  <rect x="1413" y="205" width="272" height="612" rx="30" fill="url(#screen)"/>
  <circle cx="1549" cy="226" r="7" fill="#000000"/>
  <text x="1430" y="232" class="sans" font-size="13" font-weight="600" fill="#C9CDE6">9:41</text>
  <g fill="#C9CDE6">
    <rect x="1640" y="222" width="18" height="10" rx="2"/>
    <path d="M1618 232 l12 -12 v12 z"/>
  </g>
  <text x="1430" y="296" class="display" font-size="44" font-weight="400" fill="#F5F6FF">Friday</text>
  <text x="1430" y="322" class="sans" font-size="15" fill="#A9AFCF">21 November</text>
  <!-- notification card (beam target) -->
  <rect x="1418" y="512" width="262" height="138" rx="24" fill="#46E0CF" fill-opacity="0.22" filter="url(#soft)"/>
  <rect x="1424" y="516" width="250" height="130" rx="22" fill="#262C52" stroke="#46E0CF" stroke-opacity="0.55"/>
  <circle cx="1452" cy="544" r="15" fill="#FF5D6C"/>
  <path d="M1445 551 h14 c-2 -2 -2.5 -3.5 -2.5 -7 v-3 a4.5 4.5 0 0 0 -9 0 v3 c0 3.5 -0.5 5 -2.5 7 z M1449.5 553.5 a2.5 2.5 0 0 0 5 0" fill="#FFFFFF"/>
  <text x="1476" y="549" class="sans" font-size="13" fill="#A9AFCF">Shop · now</text>
  <text x="1440" y="584" class="sans" font-size="16" font-weight="700" fill="#F5F6FF">Order shipped</text>
  <text x="1440" y="606" class="sans" font-size="14" fill="#C9CDE6">Arrives Friday</text>
  <text x="1440" y="634" class="sans" font-size="13" font-weight="700" fill="#46E0CF" letter-spacing="0.5">Track</text>
  <text x="1500" y="634" class="sans" font-size="13" font-weight="700" fill="#46E0CF" letter-spacing="0.5">Open</text>
  <!-- second notification -->
  <rect x="1424" y="658" width="250" height="70" rx="20" fill="#FFFFFF" fill-opacity="0.06"/>
  <circle cx="1452" cy="693" r="14" fill="#FFFFFF" fill-opacity="0.10"/>
  <rect x="1478" y="680" width="110" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.16"/>
  <rect x="1478" y="697" width="160" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.09"/>
  <!-- quick settings tiles -->
  <g fill="#FFFFFF" fill-opacity="0.07">
    <rect x="1430" y="356" width="118" height="52" rx="26"/>
    <rect x="1556" y="356" width="118" height="52" rx="26"/>
    <rect x="1430" y="418" width="118" height="52" rx="26"/>
    <rect x="1556" y="418" width="118" height="52" rx="26"/>
  </g>
  <rect x="1509" y="796" width="80" height="4" rx="2" fill="#F5F6FF" fill-opacity="0.6"/>
</svg>
