name: scaling

# The scaling guards of the durable profile and of campaigns, on the server engines. The `tests` workflow runs the slow
# group on SQLite only; here the same guards run on MySQL, MariaDB and PostgreSQL and print their timings (per-destination cost
# at 25,000 and 200,000 destinations, per-effect cost, reads next to a million final rows). Hosted runners are noisy:
# the numbers are an order of magnitude, the assertions are ratios. Weekly, and by hand from the Actions tab.

on:
  schedule:
    - cron: '23 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scaling:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: mysql
            port: 3306
            username: root
            password: ''
          - db: pgsql
            port: 5432
            username: postgres
            password: postgres
          - db: mariadb
            port: 3307
            username: root
            password: ''
    name: Scaling guards · ${{ matrix.db }}
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: mobile_push_test
        ports: ['3307:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: mobile_push_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=10
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mobile_push_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_CONNECTION: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_DATABASE: mobile_push_test
      DB_USERNAME: ${{ matrix.username }}
      DB_PASSWORD: ${{ matrix.password }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, openssl, json, intl, pdo_mysql, pdo_pgsql, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: composer update --prefer-dist --no-interaction
      # The mysql image starts InnoDB with a 128 MB buffer pool. 200,000 delivery rows and their indexes do not fit in
      # it, and the guards then measure the runner's disk: with the default the per-destination cost doubled between
      # 25,000 and 200,000 destinations (run of 2026-11-21). A server sized for its data is what the guards are about.
      - name: Size the InnoDB buffer pool for the test data
        if: matrix.db == 'mysql' || matrix.db == 'mariadb'
        run: |
          mysql -h 127.0.0.1 -P ${{ matrix.port }} -uroot -e "SET GLOBAL innodb_buffer_pool_size = 2147483648"
          sleep 5
          mysql -h 127.0.0.1 -P ${{ matrix.port }} -uroot -e "SELECT @@innodb_buffer_pool_size, @@version"
      - name: Campaign scaling guard (25,000 against 200,000 devices)
        run: vendor/bin/pest --group=slow tests/Scenario/Laravel/Campaigns/CampaignScalingTest.php
      - name: Durable profile scaling guards
        if: always()
        run: vendor/bin/pest --group=slow tests/Scenario/Laravel/Queue/DurableScalingTest.php
      - name: InnoDB buffer pool after the runs
        if: always() && (matrix.db == 'mysql' || matrix.db == 'mariadb')
        run: mysql -h 127.0.0.1 -P ${{ matrix.port }} -uroot -e "SHOW GLOBAL STATUS WHERE Variable_name IN ('Innodb_buffer_pool_reads','Innodb_buffer_pool_read_requests','Innodb_buffer_pool_pages_data','Innodb_buffer_pool_pages_total','Innodb_buffer_pool_wait_free')"
