name: mutation

# Mutation testing of the dense, fragile parts of the core (signatures, retry planning, classifiers, the ledger state
# machine, truncation). It is slow and its score is a quality signal, not a gate: weekly, and by hand from the Actions
# tab. Each group runs the unit tests and the scenarios that are meant to pin that code.

on:
  schedule:
    - cron: '47 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth
            classes: 'Padosoft\MobilePush\Core\Auth\DerSignature,Padosoft\MobilePush\Core\Auth\JwtEncoder'
            tests: tests/Unit/Core/Auth tests/Scenario/Auth
          - name: retry
            classes: 'Padosoft\MobilePush\Core\Retry'
            tests: tests/Unit/Core/Retry tests/Scenario/Outcome tests/Scenario/Send
          - name: apns-outcome
            classes: 'Padosoft\MobilePush\Core\Apns\Outcome'
            tests: tests/Unit/Core/Apns/Outcome tests/Scenario/Outcome tests/Scenario/Send
          - name: fcm-outcome
            classes: 'Padosoft\MobilePush\Core\Fcm\Outcome'
            tests: tests/Unit/Core/Fcm/Outcome tests/Scenario/Outcome tests/Scenario/Send
          - name: ledger-rules
            classes: 'Padosoft\MobilePush\Core\Ledger\DeliveryStateMachine,Padosoft\MobilePush\Core\Ledger\PayloadFingerprint'
            tests: tests/Unit/Core/Ledger tests/Scenario/Ledger
          - name: message-support
            classes: 'Padosoft\MobilePush\Core\Message\Support'
            tests: tests/Unit/Core/Message tests/Scenario/Apns/Compile tests/Scenario/Fcm/Compile
          - name: guards
            classes: 'Padosoft\MobilePush\Core\Guard\RateLimiter,Padosoft\MobilePush\Core\Guard\AuthBreaker,Padosoft\MobilePush\Core\Guard\DestinationQualityBreaker,Padosoft\MobilePush\Core\Guard\ThrottleGate'
            tests: tests/Unit/Core/Guard tests/Scenario/Guard tests/Scenario/Send
          - name: apns-compile
            classes: 'Padosoft\MobilePush\Core\Apns\ApnsCompiler,Padosoft\MobilePush\Core\Apns\ApnsPayloadLimits,Padosoft\MobilePush\Core\Apns\TopicResolver'
            tests: tests/Unit/Core/Apns tests/Scenario/Apns/Compile
          - name: fcm-compile
            classes: 'Padosoft\MobilePush\Core\Fcm\FcmCompiler,Padosoft\MobilePush\Core\Fcm\FcmPayloadLimits'
            tests: tests/Unit/Core/Fcm/Message tests/Scenario/Fcm/Compile
          - name: transport-parsers
            classes: 'Padosoft\MobilePush\Core\Transport\Curl\ResponseHeaderParser,Padosoft\MobilePush\Core\Transport\Curl\CurlErrorClassifier'
            tests: tests/Unit/Core/Transport tests/Scenario/Transport
          - name: ledger-core
            classes: 'Padosoft\MobilePush\Core\Ledger\LedgerRules,Padosoft\MobilePush\Core\Ledger\InMemoryLedger'
            tests: tests/Unit/Core/Ledger tests/Scenario/Ledger
          - name: ledger-database
            classes: 'Padosoft\MobilePush\Laravel\Ledger\DatabaseLedger'
            tests: tests/Unit/Laravel/Ledger tests/Scenario/Laravel/Ledger
          - name: safe-mode
            classes: 'Padosoft\MobilePush\Core\Policy\SafeModeGuard,Padosoft\MobilePush\Core\Policy\ModeResolver,Padosoft\MobilePush\Core\Policy\EndpointCatalog'
            tests: tests/Unit/Core/Policy tests/Scenario/Policy tests/Scenario/Send
          - name: privacy
            classes: 'Padosoft\MobilePush\Core\Privacy'
            tests: tests/Unit/Core/Privacy tests/Scenario/Privacy
          - name: token-providers
            classes: 'Padosoft\MobilePush\Core\Apns\Auth,Padosoft\MobilePush\Core\Fcm\Auth,Padosoft\MobilePush\Core\Auth\TokenSlot,Padosoft\MobilePush\Core\Auth\InMemoryTokenStore,Padosoft\MobilePush\Core\Auth\PrivateKey,Padosoft\MobilePush\Core\Auth\TokenCacheKey'
            tests: tests/Unit/Core/Auth tests/Scenario/Auth
          - name: send-pipeline
            classes: 'Padosoft\MobilePush\Core\Driver'
            tests: tests/Unit/Core/Driver tests/Scenario/Send
    name: Mutation · ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, openssl, json, intl, pdo_sqlite
          coverage: pcov
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: composer update --prefer-dist --no-interaction
      # Not --parallel: the parallel runner takes a single test path, and each group names several.
      - name: Mutate
        run: vendor/bin/pest --mutate --class='${{ matrix.classes }}' ${{ matrix.tests }}

  # The database ledger again, on PostgreSQL: the mutants that only a server engine can kill (row locks, SKIP LOCKED,
  # the claim's lock clause, statements SQLite accepts and a server refuses) survive the SQLite group above by
  # construction. Every test drops and migrates the schema, so this is by far the slowest job of the workflow.
  mutate-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    name: Mutation · ledger-database on PostgreSQL
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mobile_push_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: mobile_push_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, openssl, json, intl, pdo_pgsql, pdo_sqlite
          coverage: pcov
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: composer update --prefer-dist --no-interaction
      - name: Mutate
        run: >-
          vendor/bin/pest --mutate
          --class='Padosoft\MobilePush\Laravel\Ledger\DatabaseLedger'
          tests/Unit/Laravel/Ledger tests/Scenario/Laravel/Ledger
