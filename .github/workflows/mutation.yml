name: mutation

# Mutation testing of the dense, fragile parts of the core (signatures, retry planning, classifiers, outcomes, the
# ledger state machine, truncation). It is slow: weekly, and by hand from the Actions tab, never on a pull request.
# Each group runs the unit tests and the scenarios that are meant to pin that code, and fails when its score drops
# below its `min`: a floor a few points under the score measured on 2026-11-21, so a regression is noticed while the
# survivors already classified as equivalent or unreachable (progress.md) do not turn the job red. The two newest groups (auth with the OpenSSL signers, outcome) have
# floors from their first run, before the tests written for their survivors.

on:
  schedule:
    - cron: '47 4 * * 1'
  workflow_dispatch:
    inputs:
      only:
        description: 'One group to run (its name in the matrix, or "ledger-database-server"); empty runs them all'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  mutate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth
            min: 85
            classes: 'Padosoft\MobilePush\Core\Auth\DerSignature,Padosoft\MobilePush\Core\Auth\JwtEncoder,Padosoft\MobilePush\Core\Auth\OpenSslEs256Signer,Padosoft\MobilePush\Core\Auth\OpenSslRs256Signer'
            tests: tests/Unit/Core/Auth tests/Scenario/Auth
          - name: retry
            min: 88
            classes: 'Padosoft\MobilePush\Core\Retry'
            tests: tests/Unit/Core/Retry tests/Scenario/Outcome tests/Scenario/Send
          - name: apns-outcome
            min: 85
            classes: 'Padosoft\MobilePush\Core\Apns\Outcome'
            tests: tests/Unit/Core/Apns/Outcome tests/Scenario/Outcome tests/Scenario/Send
          - name: fcm-outcome
            min: 80
            classes: 'Padosoft\MobilePush\Core\Fcm\Outcome'
            tests: tests/Unit/Core/Fcm/Outcome tests/Scenario/Outcome tests/Scenario/Send
          - name: ledger-rules
            min: 94
            classes: 'Padosoft\MobilePush\Core\Ledger\DeliveryStateMachine,Padosoft\MobilePush\Core\Ledger\PayloadFingerprint'
            tests: tests/Unit/Core/Ledger tests/Scenario/Ledger
          - name: message-support
            min: 66
            classes: 'Padosoft\MobilePush\Core\Message\Support'
            tests: tests/Unit/Core/Message tests/Scenario/Apns/Compile tests/Scenario/Fcm/Compile
          - name: guards
            min: 87
            classes: 'Padosoft\MobilePush\Core\Guard\RateLimiter,Padosoft\MobilePush\Core\Guard\AuthBreaker,Padosoft\MobilePush\Core\Guard\DestinationQualityBreaker,Padosoft\MobilePush\Core\Guard\ThrottleGate'
            tests: tests/Unit/Core/Guard tests/Scenario/Guard tests/Scenario/Send
          - name: apns-compile
            min: 94
            classes: 'Padosoft\MobilePush\Core\Apns\ApnsCompiler,Padosoft\MobilePush\Core\Apns\ApnsPayloadLimits,Padosoft\MobilePush\Core\Apns\TopicResolver'
            tests: tests/Unit/Core/Apns tests/Scenario/Apns/Compile
          - name: fcm-compile
            min: 90
            classes: 'Padosoft\MobilePush\Core\Fcm\FcmCompiler,Padosoft\MobilePush\Core\Fcm\FcmPayloadLimits'
            tests: tests/Unit/Core/Fcm/Message tests/Scenario/Fcm/Compile
          - name: transport-parsers
            min: 48
            classes: 'Padosoft\MobilePush\Core\Transport\Curl\ResponseHeaderParser,Padosoft\MobilePush\Core\Transport\Curl\CurlErrorClassifier'
            tests: tests/Unit/Core/Transport tests/Scenario/Transport
          - name: ledger-core
            min: 86
            classes: 'Padosoft\MobilePush\Core\Ledger\LedgerRules,Padosoft\MobilePush\Core\Ledger\InMemoryLedger'
            tests: tests/Unit/Core/Ledger tests/Scenario/Ledger
          - name: ledger-database
            min: 87
            classes: 'Padosoft\MobilePush\Laravel\Ledger\DatabaseLedger'
            tests: tests/Unit/Laravel/Ledger tests/Scenario/Laravel/Ledger
          - name: safe-mode
            min: 86
            classes: 'Padosoft\MobilePush\Core\Policy\SafeModeGuard,Padosoft\MobilePush\Core\Policy\ModeResolver,Padosoft\MobilePush\Core\Policy\EndpointCatalog'
            tests: tests/Unit/Core/Policy tests/Scenario/Policy tests/Scenario/Send
          - name: privacy
            min: 83
            classes: 'Padosoft\MobilePush\Core\Privacy'
            tests: tests/Unit/Core/Privacy tests/Scenario/Privacy
          - name: token-providers
            min: 90
            classes: 'Padosoft\MobilePush\Core\Apns\Auth,Padosoft\MobilePush\Core\Fcm\Auth,Padosoft\MobilePush\Core\Auth\TokenSlot,Padosoft\MobilePush\Core\Auth\InMemoryTokenStore,Padosoft\MobilePush\Core\Auth\PrivateKey,Padosoft\MobilePush\Core\Auth\TokenCacheKey'
            tests: tests/Unit/Core/Auth tests/Scenario/Auth
          - name: outcome
            min: 75
            classes: 'Padosoft\MobilePush\Core\Outcome'
            tests: tests/Unit/Core/Outcome tests/Scenario/Outcome tests/Scenario/Send
          - name: send-pipeline
            min: 85
            classes: 'Padosoft\MobilePush\Core\Driver'
            tests: tests/Unit/Core/Driver tests/Scenario/Send
          # The cache-backed stores of the guards and of the provider tokens: added on 2026-11-22, after a deadlock
          # answered by MySQL on the lock table was found to make the guards fail open (measured 89.8%).
          - name: cache-stores
            min: 85
            classes: 'Padosoft\MobilePush\Laravel\Cache\CacheGuardStore,Padosoft\MobilePush\Laravel\Cache\CacheLocks,Padosoft\MobilePush\Laravel\Cache\CacheTokenStore'
            tests: tests/Unit/Laravel/Cache tests/Scenario/Laravel/Cache
          # The frequency cap and the badge counter: added on 2026-11-22 after two defects (contention read as a
          # store failure; a null limit removing the cap). Measured 88.7%.
          - name: policies
            min: 84
            classes: 'Padosoft\MobilePush\Core\Policy\Frequency,Padosoft\MobilePush\Core\Policy\Badge'
            tests: tests/Unit/Core/Policy/Frequency tests/Unit/Core/Policy/Badge tests/Scenario/Policy/Frequency tests/Scenario/Policy/Badge
          # The metric counters, gauges and the error-rate window: added on 2026-11-22 after the counters were found
          # never to be recorded on the database, memcached and dynamodb cache stores. Measured 90.1%.
          - name: metrics
            min: 85
            classes: 'Padosoft\MobilePush\Laravel\Health\MetricsRecorder,Padosoft\MobilePush\Laravel\Health\ErrorRate,Padosoft\MobilePush\Laravel\Health\ErrorRateSample'
            tests: tests/Scenario/Laravel/Health tests/Unit/Laravel/Health tests/Scenario/Laravel/Integration/BrokenMetricsStoreTest.php
    name: Mutation · ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, openssl, json, intl, pdo_sqlite
          coverage: pcov
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: composer update --prefer-dist --no-interaction
      # Not --parallel: the parallel runner takes a single test path, and each group names several.
      - name: Mutate
        if: github.event.inputs.only == '' || github.event.inputs.only == matrix.name
        run: vendor/bin/pest --mutate --min=${{ matrix.min }} --class='${{ matrix.classes }}' ${{ matrix.tests }}

  # The database ledger again, on the server engines: the mutants that only a server can kill survive the SQLite group
  # above by construction (on SQLite the lock clause compiles to nothing and there is one writer). PostgreSQL kills the
  # row-lock and SKIP LOCKED ones; MySQL the READ COMMITTED statement of the claim and the locking read that follows a
  # lost effect key. Every test drops and migrates the schema, so these are by far the slowest jobs of the workflow.
  mutate-server:
    if: github.event.inputs.only == '' || github.event.inputs.only == 'ledger-database-server'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: mysql
            label: MySQL
            port: 3306
            username: root
            password: ''
          - db: pgsql
            label: PostgreSQL
            port: 5432
            username: postgres
            password: postgres
    name: Mutation · ledger-database on ${{ matrix.label }}
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: mobile_push_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=10
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mobile_push_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_CONNECTION: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_DATABASE: mobile_push_test
      DB_USERNAME: ${{ matrix.username }}
      DB_PASSWORD: ${{ matrix.password }}
      # Read by libpq: a mutant that makes the two connections of one test wait for each other fails after 5 seconds
      # instead of hanging until the mutation runner's own timeout (the MySQL counterpart is set in a step below).
      PGOPTIONS: -c lock_timeout=5s
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, openssl, json, intl, pdo_mysql, pdo_pgsql, pdo_sqlite
          coverage: pcov
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: composer update --prefer-dist --no-interaction
      # A mutant that makes two transactions wait for each other is killed by the lock wait timeout: 5 seconds
      # instead of the 50 of the image keeps one such mutant from costing minutes.
      - name: Short lock wait on MySQL
        if: matrix.db == 'mysql'
        run: mysql -h 127.0.0.1 -uroot -e "SET GLOBAL innodb_lock_wait_timeout = 5"
      - name: Mutate
        run: >-
          vendor/bin/pest --mutate --min=87
          --class='Padosoft\MobilePush\Laravel\Ledger\DatabaseLedger'
          tests/Unit/Laravel/Ledger tests/Scenario/Laravel/Ledger
