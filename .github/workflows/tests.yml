name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        stability: [prefer-lowest, prefer-stable]
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.stability }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, openssl, json, intl, pdo_sqlite, redis
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The cache-coordination scenario starts its own redis-server when the binary exists (and skips Redis otherwise).
      - name: Install redis-server
        run: sudo apt-get update -qq && sudo apt-get install -y -qq redis-server && sudo systemctl stop redis-server || true
      - name: Install dependencies
        run: |
          composer require "illuminate/support:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction
      - name: Tests
        run: vendor/bin/pest
      - name: Slow tests (large batches)
        if: matrix.php == '8.3' && matrix.laravel == '13.*' && matrix.stability == 'prefer-stable'
        run: vendor/bin/pest --group=slow
      # What a freshly created Laravel 13 application has: a cache store that serialises and rebuilds no object
      # (cache.serializable_classes = false). See tests/TestCase.php.
      - name: Laravel tests on a strict, serialising cache store
        if: matrix.php == '8.4' && matrix.laravel == '13.*' && matrix.stability == 'prefer-stable'
        env:
          MOBILE_PUSH_TEST_STRICT_CACHE: '1'
        run: vendor/bin/pest tests/Unit/Laravel tests/Scenario/Laravel

  # EXPERIMENTAL. The suite is developed on SQLite; these jobs run the database-backed scenarios on MySQL and
  # PostgreSQL (row locks, SKIP LOCKED claims, unique constraints, keyset pagination). tests/TestCase.php empties the
  # schema before each test on a server database. They do not gate a merge until they have been green for a while: a
  # failure here is a finding to triage, not a broken build.
  databases:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: mysql
            port: 3306
            username: root
            password: ''
          - db: pgsql
            port: 5432
            username: postgres
            password: postgres
          - db: mariadb
            port: 3307
            username: root
            password: ''
    name: Database scenarios · ${{ matrix.db }} (experimental)
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: mobile_push_test
        ports: ['3307:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: mobile_push_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=10
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mobile_push_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_CONNECTION: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_DATABASE: mobile_push_test
      DB_USERNAME: ${{ matrix.username }}
      DB_PASSWORD: ${{ matrix.password }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, openssl, json, intl, pdo_mysql, pdo_pgsql, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: composer update --prefer-dist --no-interaction
      - name: Database-backed scenarios
        run: >-
          vendor/bin/pest
          tests/Unit/Laravel/Ledger tests/Scenario/Laravel/Ledger
          tests/Unit/Laravel/Devices tests/Scenario/Laravel/Devices
          tests/Unit/Laravel/LiveActivities tests/Scenario/Laravel/LiveActivities
          tests/Unit/Laravel/Campaigns tests/Scenario/Laravel/Campaigns
          tests/Unit/Laravel/Receipts tests/Scenario/Laravel/Receipts
          tests/Scenario/Laravel/Queue tests/Scenario/Laravel/Install

  # The package as a user gets it: required into a freshly created Laravel application, installed with every module,
  # migrated, and driven through its public surface (commands, facade, helper, device registry, durable queue + worker).
  # Everything is simulated: no credential exists and nothing leaves the runner.
  fresh-app:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        laravel: ['12', '13']
    name: Fresh Laravel ${{ matrix.laravel }} application
    steps:
      - uses: actions/checkout@v4
        with:
          path: package
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, openssl, json, intl, pdo_sqlite
          coverage: none
      - name: Create the application and require the package
        run: |
          composer create-project "laravel/laravel:^${{ matrix.laravel }}.0" app --no-interaction --prefer-dist
          cd app
          composer config repositories.mobile-push '{"type":"path","url":"../package","options":{"symlink":false}}'
          composer require padosoft/laravel-mobile-push:@dev --no-interaction
      - name: Install, configure, migrate
        working-directory: app
        run: |
          php artisan mobile-push:install --no-interaction --profile=durable --modules=devices,live-activities,logs,campaigns,receipts
          php ../package/tests/Support/FreshApp/configure.php "$PWD"
          php artisan migrate --no-interaction
          php artisan migrate --no-interaction | grep -q 'Nothing to migrate'
      - name: Commands, health and schedule
        working-directory: app
        run: |
          test "$(php artisan list mobile-push --raw | grep -c '^mobile-push:')" = 38
          php artisan mobile-push:health
          php artisan mobile-push:connections
          test "$(php artisan schedule:list | grep -c 'mobile-push')" = 9
      - name: Send, queue, work, verify
        working-directory: app
        run: |
          php artisan tinker --execute="$(cat ../package/tests/Support/FreshApp/send.php)" | tee send.txt
          ! grep -q 'FRESH-APP SMOKE FAILED' send.txt
          test "$(grep -c '^ok: ' send.txt)" = 6
          php artisan queue:work database --queue=push,push-bulk --stop-when-empty --tries=1 --timeout=55
          php artisan tinker --execute="$(cat ../package/tests/Support/FreshApp/verify.php)" | tee verify.txt
          ! grep -q 'FRESH-APP SMOKE FAILED' verify.txt
          test "$(grep -c '^ok: ' verify.txt)" = 4
      - name: The command line reports a simulated send with exit code 3
        working-directory: app
        run: |
          set +e
          php artisan mobile-push:send cdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcd --platform=ios --title=CI --body=hello
          test "$?" = 3

  # The runtimes the unit suite cannot stand in for, on a freshly created application: a real Redis as queue and cache
  # store, Laravel Horizon with the supervisors `mobile-push:install` prints, and Laravel Octane on RoadRunner serving
  # real HTTP requests. Everything is simulated on the provider side: no credential exists.
  runtimes:
    runs-on: ubuntu-latest
    name: Redis, Horizon and Octane (RoadRunner)
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          path: package
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, openssl, json, intl, pdo_sqlite, redis, pcntl, posix, sockets
          coverage: none
      - name: Create the application, require the package, install and migrate
        run: |
          composer create-project "laravel/laravel:^13.0" app --no-interaction --prefer-dist
          cd app
          composer config repositories.mobile-push '{"type":"path","url":"../package","options":{"symlink":false}}'
          composer require padosoft/laravel-mobile-push:@dev --no-interaction
          php artisan mobile-push:install --no-interaction --profile=durable --modules=devices,live-activities,logs,campaigns,receipts
          php ../package/tests/Support/FreshApp/configure.php "$PWD"
          sed -i '/^QUEUE_CONNECTION=/d;/^CACHE_STORE=/d;/^REDIS_/d' .env
          printf '%s\n' QUEUE_CONNECTION=redis CACHE_STORE=redis REDIS_CLIENT=phpredis REDIS_HOST=127.0.0.1 REDIS_PORT=6379 >> .env
          php artisan migrate --no-interaction
      - name: Redis as queue and cache store, with queue:work
        working-directory: app
        run: |
          php artisan mobile-push:doctor | tee doctor.txt || true
          grep -q 'The cache store takes locks' doctor.txt
          php artisan tinker --execute="$(cat ../package/tests/Support/FreshApp/send.php)" | tee send.txt
          ! grep -q 'FRESH-APP SMOKE FAILED' send.txt
          grep -q 'queue driver: redis' send.txt
          php artisan queue:work redis --queue=push,push-bulk --stop-when-empty --tries=1 --timeout=55
          php artisan tinker --execute="$(cat ../package/tests/Support/FreshApp/verify.php)" | tee verify.txt
          ! grep -q 'FRESH-APP SMOKE FAILED' verify.txt
          test "$(grep -c '^ok: ' verify.txt)" = 4
      - name: A campaign of 250 devices, planned in slices of 100, on the Redis queue
        working-directory: app
        run: |
          sed -i "s/'slice' => 1000/'slice' => 100/" config/mobile-push.php
          grep -q "'slice' => 100," config/mobile-push.php
          php artisan migrate:fresh --no-interaction
          php artisan tinker --execute="$(cat ../package/tests/Support/FreshApp/campaign.php)" | tee campaign.txt
          ! grep -q 'FRESH-APP SMOKE FAILED' campaign.txt
          grep -q 'queue driver: redis' campaign.txt
          php artisan queue:work redis --queue=push,push-bulk --stop-when-empty --tries=1 --timeout=55
          php artisan tinker --execute="$(cat ../package/tests/Support/FreshApp/verify-campaign.php)" | tee verify-campaign.txt
          ! grep -q 'FRESH-APP SMOKE FAILED' verify-campaign.txt
          test "$(grep -c '^ok: ' verify-campaign.txt)" = 4
      - name: Horizon with the supervisors the install command prints
        working-directory: app
        run: |
          composer require laravel/horizon --no-interaction
          php artisan horizon:install
          php ../package/tests/Support/FreshApp/horizon.php "$PWD"
          php artisan migrate:fresh --no-interaction
          php artisan tinker --execute='Illuminate\Support\Facades\Redis::flushall(); echo "flushed\n";'
          php artisan mobile-push:doctor | tee doctor.txt || true
          grep -q 'job_timeout (50 s) < worker_timeout (55 s)' doctor.txt
          ! grep -q 'not verifiable: job_timeout' doctor.txt
          php artisan tinker --execute="$(cat ../package/tests/Support/FreshApp/send.php)" | tee send.txt
          ! grep -q 'FRESH-APP SMOKE FAILED' send.txt
          timeout 30 php artisan horizon || true
          php artisan tinker --execute="$(cat ../package/tests/Support/FreshApp/verify-horizon.php)" | tee horizon.txt
          ! grep -q 'FRESH-APP SMOKE FAILED' horizon.txt
          test "$(grep -c '^ok: ' horizon.txt)" = 6
      - name: Octane on RoadRunner, sixty HTTP requests through two workers
        working-directory: app
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          composer require laravel/octane spiral/roadrunner-cli spiral/roadrunner-http --no-interaction
          php artisan octane:install --server=roadrunner --no-interaction
          test -x ./rr
          cat ../package/tests/Support/FreshApp/octane-routes.php >> routes/web.php
          php artisan migrate:fresh --no-interaction
          # the real transport on the wire: a local HTTP/2 mock that counts the connections it sees
          php ../package/tests/Support/FreshApp/wire-mock.php "$PWD/wire.json" > wire-mock.log 2>&1 &
          for i in $(seq 1 50); do test -s wire.json && break; sleep 0.2; done
          test -s wire.json
          echo "MOBILE_PUSH_WIRE_MOCK=$PWD/wire.json" >> .env
          php artisan octane:start --server=roadrunner --host=127.0.0.1 --port=8089 --workers=2 --max-requests=1000 > octane.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS -o /dev/null http://127.0.0.1:8089/up && break; sleep 0.5; done
          for n in $(seq 1 60); do curl -fsS "http://127.0.0.1:8089/push/$n" >> responses.txt; echo >> responses.txt; done
          # sixty more requests, each putting one HTTP/2 request on the wire through the application's transport
          for n in $(seq 1 60); do curl -fsS "http://127.0.0.1:8089/wire/$n" >> wire.txt; echo >> wire.txt; done || true
          # and sixty at once, eight at a time: requests arrive while the workers are sending
          seq 61 120 | xargs -P 8 -I{} sh -c 'curl -fsS "http://127.0.0.1:8089/wire/{}" > "wire-{}.json" || echo "{\"n\":{},\"curl\":\"failed\"}" > "wire-{}.json"'
          for n in $(seq 61 120); do cat "wire-$n.json" >> wire-concurrent.txt; echo >> wire-concurrent.txt; done
          php artisan octane:stop || true
          cat octane.log | tail -5
          head -2 responses.txt
          head -2 wire.txt
          test "$(grep -c '"status":200,"http":"2"' wire.txt)" = 60
          test "$(grep -c '"status":200,"http":"2"' wire-concurrent.txt)" = 60
          touch wire.json.stop
          for i in $(seq 1 50); do test -s wire.json.stats && break; sleep 0.2; done
          cat wire.json.stats; echo
          # the mock received all 120, on at most one connection per worker: the pool outlives the request
          php -r '$s = json_decode(file_get_contents("wire.json.stats"), true); exit($s["received"] === 120 && $s["processed"] === 120 && $s["connections"] >= 1 && $s["connections"] <= 2 ? 0 : 1);'
          # every request was served and simulated, in the default scope, by the two long-lived workers
          test "$(grep -c '"statuses":\["simulated"\]' responses.txt)" = 60
          test "$(grep -c '"scope":"default"' responses.txt)" = 60
          workers="$(grep -o '"pid":[0-9]*' responses.txt | sort -u | wc -l)"
          echo "distinct worker processes: $workers"
          test "$workers" -ge 1 && test "$workers" -le 2
          # the log records of each request were flushed when that request ended (database sink, mode all)
          php artisan tinker --execute='echo "logs: ".DB::table("mobile_push_logs")->count()."\n";' | tee logs.txt
          grep -q '^logs: 60$' logs.txt

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer update --prefer-dist --no-interaction
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G
