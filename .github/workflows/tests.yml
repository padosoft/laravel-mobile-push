name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        stability: [prefer-lowest, prefer-stable]
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.stability }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, openssl, json, intl, pdo_sqlite, redis
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The cache-coordination scenario starts its own redis-server when the binary exists (and skips Redis otherwise).
      - name: Install redis-server
        run: sudo apt-get update -qq && sudo apt-get install -y -qq redis-server && sudo systemctl stop redis-server || true
      - name: Install dependencies
        run: |
          composer require "illuminate/support:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction
      - name: Tests
        run: vendor/bin/pest
      - name: Slow tests (large batches)
        if: matrix.php == '8.3' && matrix.laravel == '13.*' && matrix.stability == 'prefer-stable'
        run: vendor/bin/pest --group=slow

  # EXPERIMENTAL. The suite is developed on SQLite; these jobs run the database-backed scenarios on MySQL and
  # PostgreSQL (row locks, SKIP LOCKED claims, unique constraints, keyset pagination). tests/TestCase.php empties the
  # schema before each test on a server database. They do not gate a merge until they have been green for a while: a
  # failure here is a finding to triage, not a broken build.
  databases:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: mysql
            port: 3306
            username: root
            password: ''
          - db: pgsql
            port: 5432
            username: postgres
            password: postgres
    name: Database scenarios · ${{ matrix.db }} (experimental)
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: mobile_push_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=10
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mobile_push_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_CONNECTION: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_DATABASE: mobile_push_test
      DB_USERNAME: ${{ matrix.username }}
      DB_PASSWORD: ${{ matrix.password }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, openssl, json, intl, pdo_mysql, pdo_pgsql, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: composer update --prefer-dist --no-interaction
      - name: Database-backed scenarios
        run: >-
          vendor/bin/pest
          tests/Unit/Laravel/Ledger tests/Scenario/Laravel/Ledger
          tests/Unit/Laravel/Devices tests/Scenario/Laravel/Devices
          tests/Unit/Laravel/LiveActivities tests/Scenario/Laravel/LiveActivities
          tests/Unit/Laravel/Campaigns tests/Scenario/Laravel/Campaigns
          tests/Unit/Laravel/Receipts tests/Scenario/Laravel/Receipts
          tests/Scenario/Laravel/Queue tests/Scenario/Laravel/Install

  # The package as a user gets it: required into a freshly created Laravel application, installed with every module,
  # migrated, and driven through its public surface (commands, facade, helper, device registry, durable queue + worker).
  # Everything is simulated: no credential exists and nothing leaves the runner.
  fresh-app:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        laravel: ['12', '13']
    name: Fresh Laravel ${{ matrix.laravel }} application
    steps:
      - uses: actions/checkout@v4
        with:
          path: package
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, openssl, json, intl, pdo_sqlite
          coverage: none
      - name: Create the application and require the package
        run: |
          composer create-project "laravel/laravel:^${{ matrix.laravel }}.0" app --no-interaction --prefer-dist
          cd app
          composer config repositories.mobile-push '{"type":"path","url":"../package","options":{"symlink":false}}'
          composer require padosoft/laravel-mobile-push:@dev --no-interaction
      - name: Install, configure, migrate
        working-directory: app
        run: |
          php artisan mobile-push:install --no-interaction --profile=durable --modules=devices,live-activities,logs,campaigns,receipts
          php ../package/tests/Support/FreshApp/configure.php "$PWD"
          php artisan migrate --no-interaction
          php artisan migrate --no-interaction | grep -q 'Nothing to migrate'
      - name: Commands, health and schedule
        working-directory: app
        run: |
          test "$(php artisan list mobile-push --raw | grep -c '^mobile-push:')" = 38
          php artisan mobile-push:health
          php artisan mobile-push:connections
          test "$(php artisan schedule:list | grep -c 'mobile-push')" = 9
      - name: Send, queue, work, verify
        working-directory: app
        run: |
          php artisan tinker --execute="$(cat ../package/tests/Support/FreshApp/send.php)" | tee send.txt
          ! grep -q 'FRESH-APP SMOKE FAILED' send.txt
          test "$(grep -c '^ok: ' send.txt)" = 6
          php artisan queue:work database --queue=push,push-bulk --stop-when-empty --tries=1 --timeout=55
          php artisan tinker --execute="$(cat ../package/tests/Support/FreshApp/verify.php)" | tee verify.txt
          ! grep -q 'FRESH-APP SMOKE FAILED' verify.txt
          test "$(grep -c '^ok: ' verify.txt)" = 4
      - name: The command line reports a simulated send with exit code 3
        working-directory: app
        run: |
          set +e
          php artisan mobile-push:send cdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcd --platform=ios --title=CI --body=hello
          test "$?" = 3

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer update --prefer-dist --no-interaction
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G
