name: backends

# Backends and runtimes the `tests` workflow does not cover, each against a real server or its local emulator:
# SQS (ElasticMQ), memcached and DynamoDB (DynamoDB Local) as queue and cache of a freshly created application, the
# multi-process cache coordination scenario on memcached and DynamoDB, and Octane on Swoole and on FrankenPHP.
# Everything is simulated: no credential exists and nothing leaves the runner (the AWS keys are the literal "local").
# Weekly, and by hand from the Actions tab.

on:
  schedule:
    - cron: '11 2 * * 3'
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local
  AWS_DEFAULT_REGION: us-east-1

jobs:
  cache-stores:
    runs-on: ubuntu-latest
    name: Cache coordination on memcached and DynamoDB
    services:
      memcached:
        image: memcached:1.6
        ports: ['11211:11211']
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports: ['8000:8000']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, openssl, json, intl, pdo_sqlite, redis, memcached
          coverage: none
      - name: Install dependencies (and the AWS SDK, for the DynamoDB cache store only)
        run: |
          composer update --prefer-dist --no-interaction
          composer require --dev aws/aws-sdk-php --no-interaction
      - name: Eight processes on a cold shared store, memcached and DynamoDB included
        env:
          MOBILE_PUSH_TEST_MEMCACHED: 127.0.0.1:11211
          MOBILE_PUSH_TEST_DYNAMODB: http://127.0.0.1:8000
          MP_RUNTIME_REPORT: '1'
        run: |
          vendor/bin/pest tests/Scenario/Laravel/Runtime/CacheCoordinationTest.php 2>&1 | tee coordination.txt
          grep -q '^\[memcached\] ' coordination.txt
          grep -q '^\[dynamodb\] ' coordination.txt

  queue-and-cache:
    runs-on: ubuntu-latest
    name: SQS queue (ElasticMQ) with memcached, then DynamoDB, as cache
    services:
      elasticmq:
        image: softwaremill/elasticmq-native:latest
        ports: ['9324:9324']
      memcached:
        image: memcached:1.6
        ports: ['11211:11211']
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports: ['8000:8000']
    steps:
      - uses: actions/checkout@v4
        with:
          path: package
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, openssl, json, intl, pdo_sqlite, memcached, pcntl, posix
          coverage: none
      - name: Queues and cache table on the local servers
        run: |
          for i in $(seq 1 40); do aws --endpoint-url http://127.0.0.1:9324 sqs list-queues > /dev/null 2>&1 && break; sleep 0.5; done
          for q in default push push-bulk; do
            aws --endpoint-url http://127.0.0.1:9324 sqs create-queue --queue-name "$q" --attributes VisibilityTimeout=120
          done
          aws --endpoint-url http://127.0.0.1:8000 dynamodb create-table --table-name cache \
            --attribute-definitions AttributeName=key,AttributeType=S --key-schema AttributeName=key,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST > /dev/null
      - name: Create the application, require the package, install and migrate
        run: |
          composer create-project "laravel/laravel:^13.0" app --no-interaction --prefer-dist
          cd app
          composer config repositories.mobile-push '{"type":"path","url":"../package","options":{"symlink":false}}'
          composer require padosoft/laravel-mobile-push:@dev aws/aws-sdk-php --no-interaction
          php artisan mobile-push:install --no-interaction --profile=durable --modules=devices,live-activities,logs,campaigns,receipts
          php ../package/tests/Support/FreshApp/configure.php "$PWD"
          php ../package/tests/Support/FreshApp/sqs.php "$PWD"
          sed -i '/^QUEUE_CONNECTION=/d;/^CACHE_STORE=/d;/^AWS_/d;/^SQS_/d;/^MEMCACHED_/d;/^DYNAMODB_/d' .env
          printf '%s\n' QUEUE_CONNECTION=sqs SQS_ENDPOINT=http://127.0.0.1:9324 SQS_PREFIX=http://127.0.0.1:9324/000000000000 \
            AWS_ACCESS_KEY_ID=local AWS_SECRET_ACCESS_KEY=local AWS_DEFAULT_REGION=us-east-1 \
            MOBILE_PUSH_QUEUE_VISIBILITY_TIMEOUT=120 \
            CACHE_STORE=memcached MEMCACHED_HOST=127.0.0.1 MEMCACHED_PORT=11211 \
            DYNAMODB_CACHE_TABLE=cache DYNAMODB_ENDPOINT=http://127.0.0.1:8000 >> .env
          php artisan migrate --no-interaction
      - name: SQS as queue, memcached as cache store, with queue:work
        working-directory: app
        run: |
          php artisan mobile-push:doctor | tee doctor.txt || true
          grep -q 'The cache store takes locks' doctor.txt
          php artisan tinker --execute="$(cat ../package/tests/Support/FreshApp/send.php)" | tee send.txt
          ! grep -q 'FRESH-APP SMOKE FAILED' send.txt
          grep -q 'queue driver: sqs' send.txt
          php artisan queue:work sqs --queue=push,push-bulk --stop-when-empty --tries=1 --timeout=55
          php artisan tinker --execute="$(cat ../package/tests/Support/FreshApp/verify.php)" | tee verify.txt
          ! grep -q 'FRESH-APP SMOKE FAILED' verify.txt
          test "$(grep -c '^ok: ' verify.txt)" = 4
      - name: The same with DynamoDB as cache store
        working-directory: app
        run: |
          sed -i 's/^CACHE_STORE=.*/CACHE_STORE=dynamodb/' .env
          php artisan migrate:fresh --no-interaction
          php artisan mobile-push:doctor | tee doctor.txt || true
          grep -q 'The cache store takes locks' doctor.txt
          php artisan tinker --execute="$(cat ../package/tests/Support/FreshApp/send.php)" | tee send.txt
          ! grep -q 'FRESH-APP SMOKE FAILED' send.txt
          grep -q 'queue driver: sqs' send.txt
          php artisan queue:work sqs --queue=push,push-bulk --stop-when-empty --tries=1 --timeout=55
          php artisan tinker --execute="$(cat ../package/tests/Support/FreshApp/verify.php)" | tee verify.txt
          ! grep -q 'FRESH-APP SMOKE FAILED' verify.txt
          test "$(grep -c '^ok: ' verify.txt)" = 4
          php artisan tinker --execute='echo "cache: ".config("cache.default")." ".get_class(Cache::store()->getStore())."\n";'

  octane:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: swoole
            label: Swoole
            extensions: ', swoole'
          - server: frankenphp
            label: FrankenPHP
            extensions: ''
    name: Octane on ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: package
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, openssl, json, intl, pdo_sqlite, pcntl, posix, sockets${{ matrix.extensions }}
          coverage: none
      - name: Create the application, require the package, install and migrate
        run: |
          composer create-project "laravel/laravel:^13.0" app --no-interaction --prefer-dist
          cd app
          composer config repositories.mobile-push '{"type":"path","url":"../package","options":{"symlink":false}}'
          composer require padosoft/laravel-mobile-push:@dev laravel/octane --no-interaction
          php artisan mobile-push:install --no-interaction --profile=durable --modules=devices,live-activities,logs,campaigns,receipts
          php ../package/tests/Support/FreshApp/configure.php "$PWD"
          php artisan migrate --no-interaction
      - name: Sixty HTTP requests through two long-lived workers
        working-directory: app
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          php artisan octane:install --server=${{ matrix.server }} --no-interaction
          cat ../package/tests/Support/FreshApp/octane-routes.php >> routes/web.php
          php artisan octane:start --server=${{ matrix.server }} --host=127.0.0.1 --port=8089 --workers=2 --max-requests=1000 > octane.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:8089/up && break; sleep 0.5; done
          for n in $(seq 1 60); do curl -fsS "http://127.0.0.1:8089/push/$n" >> responses.txt; echo >> responses.txt; done || true
          php artisan octane:stop --server=${{ matrix.server }} || true
          tail -20 octane.log
          head -2 responses.txt
          # every request was served and simulated, in the default scope, by the long-lived workers
          test "$(grep -c '"statuses":\["simulated"\]' responses.txt)" = 60
          test "$(grep -c '"scope":"default"' responses.txt)" = 60
          workers="$(grep -o '"pid":[0-9]*' responses.txt | sort -u | wc -l)"
          echo "distinct worker processes: $workers"
          test "$workers" -ge 1 && test "$workers" -le 2
          # the log records of each request were flushed when that request ended (database sink, mode all)
          php artisan tinker --execute='echo "logs: ".DB::table("mobile_push_logs")->count()."\n";' | tee logs.txt
          grep -q '^logs: 60$' logs.txt
