name: backends

# Backends and runtimes the `tests` workflow does not cover, each against a real server or its local emulator:
# SQS (ElasticMQ), memcached and DynamoDB (DynamoDB Local) as queue and cache of a freshly created application, the
# multi-process cache coordination scenario on memcached and DynamoDB, and Octane on Swoole and on FrankenPHP.
# Everything is simulated: no credential exists and nothing leaves the runner (the AWS keys are the literal "local").
# Weekly, and by hand from the Actions tab.

on:
  schedule:
    - cron: '11 2 * * 3'
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local
  AWS_DEFAULT_REGION: us-east-1

jobs:
  cache-stores:
    runs-on: ubuntu-latest
    name: Cache coordination on memcached and DynamoDB; APNs signer on a KMS emulator
    services:
      memcached:
        image: memcached:1.6
        ports: ['11211:11211']
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports: ['8000:8000']
      kms:
        image: nsmithuk/local-kms:latest
        ports: ['8088:8080']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, openssl, json, intl, pdo_sqlite, redis, memcached
          coverage: none
      - name: Install dependencies (and the AWS SDK, for the DynamoDB cache store only)
        run: |
          composer update --prefer-dist --no-interaction
          composer require --dev aws/aws-sdk-php --no-interaction
      - name: Eight processes on a cold shared store, memcached and DynamoDB included
        env:
          MOBILE_PUSH_TEST_MEMCACHED: 127.0.0.1:11211
          MOBILE_PUSH_TEST_DYNAMODB: http://127.0.0.1:8000
          MP_RUNTIME_REPORT: '1'
        run: |
          vendor/bin/pest tests/Scenario/Laravel/Runtime/CacheCoordinationTest.php 2>&1 | tee coordination.txt
          grep -q '^\[memcached\] ' coordination.txt
          grep -q '^\[dynamodb\] ' coordination.txt
      - name: Frequency cap and badge counter of one person under eight processes, memcached and DynamoDB included
        env:
          MOBILE_PUSH_TEST_MEMCACHED: 127.0.0.1:11211
          MOBILE_PUSH_TEST_DYNAMODB: http://127.0.0.1:8000
          MP_RUNTIME_REPORT: '1'
        run: |
          vendor/bin/pest tests/Scenario/Laravel/Runtime/PolicyCoordinationTest.php 2>&1 | tee policy-coordination.txt
          grep -q '^\[cap/allow memcached\] ' policy-coordination.txt
          grep -q '^\[cap/allow dynamodb\] ' policy-coordination.txt
          grep -q '^\[badge/distinct memcached\] ' policy-coordination.txt
          grep -q '^\[badge/distinct dynamodb\] ' policy-coordination.txt
      - name: Metric counters of eight processes, memcached and DynamoDB included
        env:
          MOBILE_PUSH_TEST_MEMCACHED: 127.0.0.1:11211
          MOBILE_PUSH_TEST_DYNAMODB: http://127.0.0.1:8000
          MP_RUNTIME_REPORT: '1'
        run: |
          vendor/bin/pest tests/Scenario/Laravel/Runtime/MetricsCoordinationTest.php 2>&1 | tee metrics-coordination.txt
          grep -q '^\[metrics memcached\] recorded=200 counted=200 series=1' metrics-coordination.txt
          grep -q '^\[metrics dynamodb\] recorded=200 counted=200 series=1' metrics-coordination.txt
      - name: The APNs provider token signed through the AWS KMS API (local emulator)
        env:
          MOBILE_PUSH_TEST_KMS: http://127.0.0.1:8088
        run: |
          vendor/bin/pest --colors=never tests/Scenario/Laravel/Sending/KmsSignerTest.php 2>&1 | tee kms.txt
          grep -Eq 'Tests: +1 passed' kms.txt
      - name: The APNs provider token signed inside a PKCS#11 token (SoftHSM 2, key never extractable)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq softhsm2 opensc
          # The module is in the package softhsm2 or libsofthsm2, depending on the distribution release.
          module="$(dpkg -L softhsm2 libsofthsm2 2> /dev/null | grep -m1 'libsofthsm2\.so$' || true)"
          test -f "$module"
          MOBILE_PUSH_TEST_PKCS11="$module" vendor/bin/pest --colors=never tests/Scenario/Laravel/Sending/HsmSignerTest.php 2>&1 | tee hsm.txt
          grep -Eq 'Tests: +2 passed' hsm.txt

  queue-and-cache:
    runs-on: ubuntu-latest
    name: SQS queue (ElasticMQ) with memcached, then DynamoDB, as cache
    services:
      elasticmq:
        image: softwaremill/elasticmq-native:latest
        ports: ['9324:9324']
      memcached:
        image: memcached:1.6
        ports: ['11211:11211']
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports: ['8000:8000']
    steps:
      - uses: actions/checkout@v4
        with:
          path: package
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, openssl, json, intl, pdo_sqlite, memcached, pcntl, posix
          coverage: none
      - name: Queues and cache table on the local servers
        run: |
          for i in $(seq 1 40); do aws --endpoint-url http://127.0.0.1:9324 sqs list-queues > /dev/null 2>&1 && break; sleep 0.5; done
          for q in default push push-bulk; do
            aws --endpoint-url http://127.0.0.1:9324 sqs create-queue --queue-name "$q" --attributes VisibilityTimeout=120
          done
          aws --endpoint-url http://127.0.0.1:8000 dynamodb create-table --table-name cache \
            --attribute-definitions AttributeName=key,AttributeType=S --key-schema AttributeName=key,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST > /dev/null
      - name: Create the application, require the package, install and migrate
        run: |
          composer create-project "laravel/laravel:^13.0" app --no-interaction --prefer-dist
          cd app
          composer config repositories.mobile-push '{"type":"path","url":"../package","options":{"symlink":false}}'
          composer require padosoft/laravel-mobile-push:@dev aws/aws-sdk-php --no-interaction
          php artisan mobile-push:install --no-interaction --profile=durable --modules=devices,live-activities,logs,campaigns,receipts
          php ../package/tests/Support/FreshApp/configure.php "$PWD"
          php ../package/tests/Support/FreshApp/sqs.php "$PWD"
          sed -i '/^QUEUE_CONNECTION=/d;/^CACHE_STORE=/d;/^AWS_/d;/^SQS_/d;/^MEMCACHED_/d;/^DYNAMODB_/d' .env
          printf '%s\n' QUEUE_CONNECTION=sqs SQS_ENDPOINT=http://127.0.0.1:9324 SQS_PREFIX=http://127.0.0.1:9324/000000000000 \
            AWS_ACCESS_KEY_ID=local AWS_SECRET_ACCESS_KEY=local AWS_DEFAULT_REGION=us-east-1 \
            MOBILE_PUSH_QUEUE_VISIBILITY_TIMEOUT=120 \
            CACHE_STORE=memcached MEMCACHED_HOST=127.0.0.1 MEMCACHED_PORT=11211 \
            DYNAMODB_CACHE_TABLE=cache DYNAMODB_ENDPOINT=http://127.0.0.1:8000 >> .env
          php artisan migrate --no-interaction
      - name: SQS as queue, memcached as cache store, with queue:work
        working-directory: app
        run: |
          php artisan mobile-push:doctor | tee doctor.txt || true
          grep -q 'The cache store takes locks' doctor.txt
          php artisan tinker --execute="$(cat ../package/tests/Support/FreshApp/send.php)" | tee send.txt
          ! grep -q 'FRESH-APP SMOKE FAILED' send.txt
          grep -q 'queue driver: sqs' send.txt
          php artisan queue:work sqs --queue=push,push-bulk --stop-when-empty --tries=1 --timeout=55
          php artisan tinker --execute="$(cat ../package/tests/Support/FreshApp/verify.php)" | tee verify.txt
          ! grep -q 'FRESH-APP SMOKE FAILED' verify.txt
          test "$(grep -c '^ok: ' verify.txt)" = 4
      - name: A campaign of 250 devices, planned in slices of 100, on the SQS queue
        working-directory: app
        run: |
          sed -i "s/'slice' => 1000/'slice' => 100/" config/mobile-push.php
          grep -q "'slice' => 100," config/mobile-push.php
          php artisan migrate:fresh --no-interaction
          php artisan tinker --execute="$(cat ../package/tests/Support/FreshApp/campaign.php)" | tee campaign.txt
          ! grep -q 'FRESH-APP SMOKE FAILED' campaign.txt
          grep -q 'queue driver: sqs' campaign.txt
          php artisan queue:work sqs --queue=push,push-bulk --stop-when-empty --tries=1 --timeout=55
          php artisan tinker --execute="$(cat ../package/tests/Support/FreshApp/verify-campaign.php)" | tee verify-campaign.txt
          ! grep -q 'FRESH-APP SMOKE FAILED' verify-campaign.txt
          test "$(grep -c '^ok: ' verify-campaign.txt)" = 4
      - name: The same with DynamoDB as cache store
        working-directory: app
        run: |
          sed -i 's/^CACHE_STORE=.*/CACHE_STORE=dynamodb/' .env
          php artisan migrate:fresh --no-interaction
          php artisan mobile-push:doctor | tee doctor.txt || true
          grep -q 'The cache store takes locks' doctor.txt
          php artisan tinker --execute="$(cat ../package/tests/Support/FreshApp/send.php)" | tee send.txt
          ! grep -q 'FRESH-APP SMOKE FAILED' send.txt
          grep -q 'queue driver: sqs' send.txt
          php artisan queue:work sqs --queue=push,push-bulk --stop-when-empty --tries=1 --timeout=55
          php artisan tinker --execute="$(cat ../package/tests/Support/FreshApp/verify.php)" | tee verify.txt
          ! grep -q 'FRESH-APP SMOKE FAILED' verify.txt
          test "$(grep -c '^ok: ' verify.txt)" = 4
          php artisan tinker --execute='echo "cache: ".config("cache.default")." ".get_class(Cache::store()->getStore())."\n";'

  octane:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: swoole
            label: Swoole
            extensions: ', swoole'
            ext: swoole
          - server: swoole
            label: OpenSwoole
            extensions: ', openswoole'
            ext: openswoole
          - server: frankenphp
            label: FrankenPHP
            extensions: ''
            ext: ''
    name: Octane on ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: package
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, openssl, json, intl, pdo_sqlite, pcntl, posix, sockets${{ matrix.extensions }}
          coverage: none
      - name: Create the application, require the package, install and migrate
        run: |
          composer create-project "laravel/laravel:^13.0" app --no-interaction --prefer-dist
          cd app
          composer config repositories.mobile-push '{"type":"path","url":"../package","options":{"symlink":false}}'
          composer require padosoft/laravel-mobile-push:@dev laravel/octane --no-interaction
          php artisan mobile-push:install --no-interaction --profile=durable --modules=devices,live-activities,logs,campaigns,receipts
          php ../package/tests/Support/FreshApp/configure.php "$PWD"
          php artisan migrate --no-interaction
      - name: Sixty HTTP requests through two long-lived workers
        working-directory: app
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          php artisan octane:install --server=${{ matrix.server }} --no-interaction
          # for the record: which server this run exercised
          if [ "${{ matrix.server }}" = swoole ]; then php --ri ${{ matrix.ext }} | grep -i 'version'; else ./frankenphp version; fi
          cat ../package/tests/Support/FreshApp/octane-routes.php >> routes/web.php
          # the real transport on the wire: a local HTTP/2 mock that counts the connections it sees
          php ../package/tests/Support/FreshApp/wire-mock.php "$PWD/wire.json" > wire-mock.log 2>&1 &
          for i in $(seq 1 50); do test -s wire.json && break; sleep 0.2; done
          test -s wire.json
          echo "MOBILE_PUSH_WIRE_MOCK=$PWD/wire.json" >> .env
          php artisan octane:start --server=${{ matrix.server }} --host=127.0.0.1 --port=8089 --workers=2 --max-requests=1000 > octane.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:8089/up && break; sleep 0.5; done
          for n in $(seq 1 60); do curl -fsS "http://127.0.0.1:8089/push/$n" >> responses.txt; echo >> responses.txt; done || true
          # sixty more requests, each putting one HTTP/2 request on the wire through the application's transport
          for n in $(seq 1 60); do curl -fsS "http://127.0.0.1:8089/wire/$n" >> wire.txt; echo >> wire.txt; done || true
          # and sixty at once, eight at a time: requests arrive while the workers are sending
          seq 61 120 | xargs -P 8 -I{} sh -c 'curl -fsS "http://127.0.0.1:8089/wire/{}" > "wire-{}.json" || echo "{\"n\":{},\"curl\":\"failed\"}" > "wire-{}.json"'
          for n in $(seq 61 120); do cat "wire-$n.json" >> wire-concurrent.txt; echo >> wire-concurrent.txt; done
          php artisan octane:stop --server=${{ matrix.server }} || true
          tail -20 octane.log
          head -2 responses.txt
          head -2 wire.txt
          test "$(grep -c '"status":200,"http":"2"' wire.txt)" = 60
          test "$(grep -c '"status":200,"http":"2"' wire-concurrent.txt)" = 60
          touch wire.json.stop
          for i in $(seq 1 50); do test -s wire.json.stats && break; sleep 0.2; done
          cat wire.json.stats; echo
          # the mock received all 120, on at most one connection per worker: the pool outlives the request
          php -r '$s = json_decode(file_get_contents("wire.json.stats"), true); exit($s["received"] === 120 && $s["processed"] === 120 && $s["connections"] >= 1 && $s["connections"] <= 2 ? 0 : 1);'
          # every request was served and simulated, in the default scope, by the long-lived workers
          test "$(grep -c '"statuses":\["simulated"\]' responses.txt)" = 60
          test "$(grep -c '"scope":"default"' responses.txt)" = 60
          workers="$(grep -o '"pid":[0-9]*' responses.txt | sort -u | wc -l)"
          echo "distinct worker processes: $workers"
          test "$workers" -ge 1 && test "$workers" -le 2
          # the log records of each request were flushed when that request ended (database sink, mode all)
          php artisan tinker --execute='echo "logs: ".DB::table("mobile_push_logs")->count()."\n";' | tee logs.txt
          grep -q '^logs: 60$' logs.txt

  # Swoole with its coroutine hooks on (curl included), and requests arriving eight at a time. With the hooks a second
  # request enters a worker while the first one waits inside curl. Sharing one connection pool between them crashed
  # the workers inside curl (runs of 2026-11-21, before transport.reuse existed: 4 and 9 of 60 concurrent requests
  # succeeded). With transport.reuse = auto, the default, such a send gets its own pool: the transport no longer
  # fails, but Octane's application container is still shared between the requests a worker interleaves (two runs:
  # 60 and 55 of 60 succeeded, the failures being container errors such as `Class "config" does not exist`). The job
  # asserts what is the package's: one request at a time works, reuse is off (one connection per send), no worker
  # dies inside the connection pool, and the doctor warns. The concurrent count is printed, not asserted.
  swoole-coroutine-hooks:
    runs-on: ubuntu-latest
    name: Octane on Swoole with coroutine hooks (observation)
    steps:
      - uses: actions/checkout@v4
        with:
          path: package
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, openssl, json, intl, pdo_sqlite, pcntl, posix, sockets, swoole
          coverage: none
      - name: Create the application, require the package, install and migrate
        run: |
          composer create-project "laravel/laravel:^13.0" app --no-interaction --prefer-dist
          cd app
          composer config repositories.mobile-push '{"type":"path","url":"../package","options":{"symlink":false}}'
          composer require padosoft/laravel-mobile-push:@dev laravel/octane --no-interaction
          php artisan mobile-push:install --no-interaction --profile=durable --modules=devices,live-activities,logs,campaigns,receipts
          php ../package/tests/Support/FreshApp/configure.php "$PWD"
          php artisan migrate --no-interaction
      - name: Sixty sequential and sixty concurrent requests through the transport, hooks on
        working-directory: app
        run: |
          php artisan octane:install --server=swoole --no-interaction
          php --ri swoole | grep -iE 'version|curl'
          # every hook Swoole has, curl included, for the HTTP workers
          sed -i "s/^return \[/return [\n    'swoole' => ['options' => ['hook_flags' => SWOOLE_HOOK_ALL, 'enable_coroutine' => true]],/" config/octane.php
          grep -q "SWOOLE_HOOK_ALL" config/octane.php
          cat ../package/tests/Support/FreshApp/octane-routes.php >> routes/web.php
          php ../package/tests/Support/FreshApp/wire-mock.php "$PWD/wire.json" > wire-mock.log 2>&1 &
          for i in $(seq 1 50); do test -s wire.json && break; sleep 0.2; done
          test -s wire.json
          echo "MOBILE_PUSH_WIRE_MOCK=$PWD/wire.json" >> .env
          php artisan octane:start --server=swoole --host=127.0.0.1 --port=8089 --workers=2 --max-requests=1000 > octane.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:8089/up && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:8089/hooks; echo
          for n in $(seq 1 60); do curl -sS -m 20 "http://127.0.0.1:8089/wire/$n" >> wire.txt; echo >> wire.txt; done || true
          seq 61 120 | xargs -P 8 -I{} sh -c 'curl -sS -m 20 "http://127.0.0.1:8089/wire/{}" > "wire-{}.json" || echo "{\"n\":{},\"curl\":\"failed\"}" > "wire-{}.json"' || true
          for n in $(seq 61 120); do cat "wire-$n.json" >> wire-concurrent.txt; echo >> wire-concurrent.txt; done
          php artisan octane:stop --server=swoole || true
          touch wire.json.stop
          for i in $(seq 1 50); do test -s wire.json.stats && break; sleep 0.2; done
          echo "sequential ok: $(grep -c '"status":200,"http":"2"' wire.txt) of 60"
          echo "concurrent ok: $(grep -c '"status":200,"http":"2"' wire-concurrent.txt) of 60"
          echo "mock: $(cat wire.json.stats)"
          echo "--- answers that were not a 200 over HTTP/2 (first ten)"
          grep -hv '"status":200,"http":"2"' wire.txt wire-concurrent.txt | grep -v '^$' | cut -c1-400 | head -10 || true
          echo "--- octane log (last thirty lines)"
          tail -30 octane.log
          echo "--- application log (errors)"
          grep -hE 'ERROR|Fatal|Exception' storage/logs/*.log 2>/dev/null | cut -c1-400 | sort | uniq -c | sort -rn | head -10 || true
          echo "--- the first errors of the workers"
          grep -m 6 -E 'Uncaught|Fatal error|cannot be operated|Swoole.Error' octane.log | cut -c1-400 || true
          # See the comment of the job for what is asserted and why the concurrent count is not.
          test "$(grep -c '"status":200,"http":"2"' wire.txt)" = 60
          php -r '$s = json_decode(file_get_contents("wire.json.stats"), true); echo "connections: ", $s["connections"], "\n"; exit($s["connections"] >= 60 ? 0 : 1);'
          ! grep -q 'CurlPool.php' octane.log
          php artisan mobile-push:doctor | tee doctor.txt || true
          grep -q 'not safe under concurrent requests' doctor.txt

  beanstalkd:
    runs-on: ubuntu-latest
    name: beanstalkd queue
    steps:
      - uses: actions/checkout@v4
        with:
          path: package
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, openssl, json, intl, pdo_sqlite, pcntl, posix, sockets
          coverage: none
      - name: Start beanstalkd
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq beanstalkd
          sudo systemctl stop beanstalkd || true
          beanstalkd -l 127.0.0.1 -p 11300 > beanstalkd.log 2>&1 &
          sleep 1
          beanstalkd -v
      - name: Create the application, require the package, install and migrate
        run: |
          composer create-project "laravel/laravel:^13.0" app --no-interaction --prefer-dist
          cd app
          composer config repositories.mobile-push '{"type":"path","url":"../package","options":{"symlink":false}}'
          composer require padosoft/laravel-mobile-push:@dev pda/pheanstalk --no-interaction
          php artisan mobile-push:install --no-interaction --profile=durable --modules=devices,live-activities,logs,campaigns,receipts
          php ../package/tests/Support/FreshApp/configure.php "$PWD"
          sed -i '/^QUEUE_CONNECTION=/d;/^BEANSTALKD_/d' .env
          printf '%s\n' QUEUE_CONNECTION=beanstalkd BEANSTALKD_QUEUE_HOST=127.0.0.1 >> .env
          php artisan migrate --no-interaction
      - name: beanstalkd as queue, with queue:work
        working-directory: app
        run: |
          php artisan mobile-push:doctor | tee doctor.txt || true
          php artisan tinker --execute="$(cat ../package/tests/Support/FreshApp/send.php)" | tee send.txt
          ! grep -q 'FRESH-APP SMOKE FAILED' send.txt
          grep -q 'queue driver: beanstalkd' send.txt
          php artisan queue:work beanstalkd --queue=push,push-bulk --stop-when-empty --tries=1 --timeout=55
          php artisan tinker --execute="$(cat ../package/tests/Support/FreshApp/verify.php)" | tee verify.txt
          ! grep -q 'FRESH-APP SMOKE FAILED' verify.txt
          test "$(grep -c '^ok: ' verify.txt)" = 4
      - name: A campaign of 250 devices, planned in slices of 100, on the beanstalkd queue
        working-directory: app
        run: |
          sed -i "s/'slice' => 1000/'slice' => 100/" config/mobile-push.php
          grep -q "'slice' => 100," config/mobile-push.php
          php artisan migrate:fresh --no-interaction
          php artisan tinker --execute="$(cat ../package/tests/Support/FreshApp/campaign.php)" | tee campaign.txt
          ! grep -q 'FRESH-APP SMOKE FAILED' campaign.txt
          grep -q 'queue driver: beanstalkd' campaign.txt
          php artisan queue:work beanstalkd --queue=push,push-bulk --stop-when-empty --tries=1 --timeout=55
          php artisan tinker --execute="$(cat ../package/tests/Support/FreshApp/verify-campaign.php)" | tee verify-campaign.txt
          ! grep -q 'FRESH-APP SMOKE FAILED' verify-campaign.txt
          test "$(grep -c '^ok: ' verify-campaign.txt)" = 4
