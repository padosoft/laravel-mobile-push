name: hunt

# Repeats one multi-process scenario many times to catch a rare failure with its trace. By hand only.
# First use (2026-11-22): the badge counter on the `file` cache store handed out duplicate numbers once on a hosted
# runner (155 distinct of 200) and never locally. MP_POLICY_TRACE makes the contenders report every empty read, failed
# write and delete-on-read of the store's filesystem.

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: 'Repetitions per shard'
        required: false
        default: '40'

permissions:
  contents: read

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
        php: ['8.2']
    name: Badge counter on the file store · shard ${{ matrix.shard }} · PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, openssl, json, intl, pdo_sqlite
          coverage: none
      - run: composer update --prefer-dist --no-interaction
      - name: Repeat the scenario
        env:
          MP_POLICY_TRACE: '1'
          MP_RUNTIME_REPORT: '1'
        run: |
          php -v | head -1 && composer show laravel/framework | grep -E '^versions'
          bad=0
          for i in $(seq 1 ${{ github.event.inputs.rounds || '40' }}); do
            vendor/bin/pest --colors=never tests/Scenario/Laravel/Runtime/PolicyCoordinationTest.php --filter="badge counter loses no increment" > out.txt 2>&1 || true
            if grep -E '^\[badge/distinct file\]' out.txt | grep -qv 'counted=200 unique=200 contended(gave up)=0 final=200' || grep -E '^\[trace file\] [0-9]' out.txt > /dev/null || ! grep -q '^\[badge/distinct file\]' out.txt; then
              bad=$((bad+1))
              echo "===== round $i: anomaly ====="
              grep -E '^\[badge/distinct|^\[trace file\]|asserting|Tests:' out.txt | head -80
            fi
          done
          echo "rounds with an anomaly: $bad"
          test "$bad" = 0
